[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "biocandidate-ranker"
version = "0.1.0"
description = "Host-aware multimodal enzyme candidate scoring research system"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "torch>=2.2",
    "rdkit>=2023.9",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff==0.15.22"]
baseline = ["scikit-learn>=1.5"]
simulation = ["cobra>=0.30"]
esm2 = ["fair-esm>=2.0"]
full = ["scikit-learn>=1.5", "cobra>=0.30", "fair-esm>=2.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

# The audit, recovery and replay scripts are point-in-time governance records
# kept in their compact authored style; splitting their one-liners would churn
# several hundred lines of replay-critical code for no behavioural gain, so
# the statement-layout rules are waived for that directory only. src/ and
# every other test file stay fully linted, and correctness rules (F) apply
# everywhere.
[tool.ruff.lint.per-file-ignores]
"scripts/**" = ["E701", "E702", "E401", "E402"]
"tests/test_catapro_mode_b.py" = ["E701", "E702"]
"tests/test_catpred_noncanonical_adapter.py" = ["E701", "E702"]
"tests/test_catapro_evaluation_freeze.py" = ["E701", "E702"]
"tests/test_paired_family_analysis.py" = ["E701", "E702"]
