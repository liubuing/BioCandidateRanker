<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BioCandidateRanker 工作台</title>
<style>
:root {
  --bg: #f6f7f9; --panel: #fff; --ink: #14181f; --muted: #5c6675;
  --line: #e2e6ec; --accent: #2c6fbb; --ok: #1f7a4d; --bad: #b3261e; --warn: #a8620a;
  --ok-bg: #e8f5ee; --bad-bg: #fdecea; --warn-bg: #fdf3e3;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink);
  font: 14px/1.55 -apple-system, "Segoe UI", "Microsoft YaHei", Roboto, Helvetica, Arial, sans-serif; }
header { background: var(--panel); border-bottom: 1px solid var(--line); padding: 16px 24px;
  display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap; }
h1 { margin: 0; font-size: 18px; }
header .meta { color: var(--muted); font-size: 12.5px; }
header .spacer { flex: 1; }
header a { color: var(--accent); font-size: 13px; text-decoration: none; }
header a:hover { text-decoration: underline; }
#lang-btn { border: 1px solid var(--line); background: none; border-radius: 999px;
  padding: 4px 12px; font: inherit; font-size: 12px; cursor: pointer; color: var(--muted); }
#lang-btn:hover { color: var(--ink); border-color: var(--accent); }
nav { display: flex; gap: 2px; padding: 0 24px; background: var(--panel);
  border-bottom: 1px solid var(--line); overflow-x: auto; }
nav button { border: 0; background: none; padding: 11px 15px; cursor: pointer;
  font: inherit; font-weight: 500; color: var(--muted);
  border-bottom: 2px solid transparent; white-space: nowrap; }
nav button:hover { color: var(--ink); }
nav button[aria-selected="true"] { color: var(--accent); border-bottom-color: var(--accent); }
main { padding: 20px 24px 60px; max-width: 1200px; }
section[hidden] { display: none; }
h2 { font-size: 15.5px; margin: 0 0 12px; }
h3 { font-size: 12.5px; margin: 20px 0 8px; color: var(--muted);
  text-transform: uppercase; letter-spacing: .05em; }
.grid { display: grid; grid-template-columns: 340px 1fr; gap: 16px; align-items: start; }
@media (max-width: 900px) { .grid { grid-template-columns: 1fr; } }
.panel { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; }
label { display: block; font-size: 12px; color: var(--muted); margin: 10px 0 4px; }
label:first-child { margin-top: 0; }
textarea, input, select { width: 100%; padding: 8px 10px; border: 1px solid var(--line);
  border-radius: 7px; font: inherit; font-size: 13px; background: #fbfcfe; }
textarea { resize: vertical; min-height: 84px; font-family: ui-monospace, Menlo, Consolas, monospace; }
button.primary { background: var(--accent); color: #fff; border: 0; border-radius: 8px;
  padding: 9px 16px; font: inherit; font-weight: 600; cursor: pointer; margin-top: 12px; }
button.primary:disabled { opacity: .55; cursor: wait; }
button.ghost { background: none; border: 1px solid var(--line); border-radius: 8px;
  padding: 7px 12px; font: inherit; font-size: 12.5px; cursor: pointer; color: var(--muted);
  margin-top: 12px; margin-left: 8px; }
button.ghost:hover { color: var(--ink); }
.pill { display: inline-block; padding: 2px 9px; border-radius: 999px; font-size: 11.5px; font-weight: 600; }
.pill.ok { background: var(--ok-bg); color: var(--ok); }
.pill.bad { background: var(--bad-bg); color: var(--bad); }
.pill.warn { background: var(--warn-bg); color: var(--warn); }
.pill.dim { background: #eef1f5; color: var(--muted); }
.error { background: var(--bad-bg); color: var(--bad); border-radius: 8px;
  padding: 10px 14px; margin-bottom: 12px; font-size: 13px; white-space: pre-wrap; }
.result-card { margin-bottom: 14px; }
.result-card .cid { font-weight: 650; margin-bottom: 6px; }
table { width: 100%; border-collapse: collapse; background: var(--panel);
  border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
th, td { text-align: left; padding: 8px 11px; border-bottom: 1px solid var(--line); font-size: 12.5px; }
th { background: #fafbfc; color: var(--muted); font-weight: 600; font-size: 11.5px;
  text-transform: uppercase; letter-spacing: .04em; }
tbody tr:last-child td { border-bottom: 0; }
.num { font-variant-numeric: tabular-nums; }
pre.out { background: #10141b; color: #d6e2f2; border-radius: 8px; padding: 14px;
  font: 12px/1.5 ui-monospace, Menlo, Consolas, monospace; overflow: auto; max-height: 480px; }
.actions { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 12px; }
.action { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 14px; }
.action h4 { margin: 0 0 6px; font-size: 13.5px; }
.action p { margin: 0 0 10px; color: var(--muted); font-size: 12.5px; }
.action button { width: 100%; }
.gobtn { background: var(--accent); color: #fff; border: 0; border-radius: 8px;
  padding: 8px 14px; font: inherit; font-weight: 600; cursor: pointer; }
.gobtn:disabled { opacity: .55; cursor: wait; }
.note { color: var(--muted); font-size: 12px; margin-top: 10px; }
.metrics { color: var(--muted); font-size: 11.5px; }
.mono { font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 12px; }
</style>
</head>
<body>
<header>
  <h1 data-i18n="title"></h1>
  <span class="meta" id="health"></span>
  <span class="spacer"></span>
  <a href="/dashboard" target="_blank" data-i18n="dashboardLink"></a>
  <button id="lang-btn" title="切换语言"></button>
</header>
<nav id="tabs" role="tablist">
  <button role="tab" data-id="predict" aria-selected="true" data-i18n="tab_predict"></button>
  <button role="tab" data-id="batch" data-i18n="tab_batch"></button>
  <button role="tab" data-id="models" data-i18n="tab_models"></button>
  <button role="tab" data-id="fba" data-i18n="tab_fba"></button>
  <button role="tab" data-id="governance" data-i18n="tab_governance"></button>
</nav>

        <label for="f-seq" data-i18n="labelSeq"></label>
        <textarea id="f-seq" placeholder="MSTAGKVIKCKAAVLWELKKP"></textarea>
        <label for="f-smi" data-i18n="labelSmiles"></label>

        <input id="f-name">
        <label for="f-org" data-i18n="labelOrganism"></label>
        <input id="f-org">
        <label for="f-ec" data-i18n="labelEc"></label>
        <input id="f-ec" placeholder="1.1.1.1">
        <label for="f-type" data-i18n="labelEnzymeType"></label>
        <select id="f-type">
          <option value="wildtype" data-i18n="typeWildtype"></option>
          <option value="mutant" data-i18n="typeMutant"></option>
          <option value="unknown" data-i18n="typeUnknown"></option>
        </select>
        <label for="f-rxn" data-i18n="labelReaction"></label>
        <input id="f-rxn">
        <label for="f-model" data-i18n="labelCheckpoint"></label>
        <select id="f-model"></select>
        <label for="f-cal" data-i18n="labelCalibration"></label>
        <input id="f-cal" class="mono" placeholder="artifacts/uncertainty-calibration-v2/grouped-cv.json">
        <div id="fba-badge" style="margin-top:10px"></div>
        <button class="primary" id="btn-predict" data-i18n="btnPredict"></button>
        <button class="ghost" id="btn-example" data-i18n="btnExample"></button>
        <p class="note" data-i18n="fbaNote"></p>
      </div>
      <div id="predict-results"></div>
    </div>
  </section>

  <!-- ============ BATCH ============ -->
  <section id="sec-batch" hidden>
    <h2 data-i18n="batchTitle"></h2>
    <p class="sub" data-i18n="batchIntro"></p>
    <div class="grid">
      <div class="panel">
        <label for="b-json" data-i18n="batchJsonLabel"></label>
        <textarea id="b-json" style="min-height:320px"></textarea>
        <label for="b-model" data-i18n="labelCheckpoint"></label>
        <select id="b-model"></select>
        <button class="primary" id="btn-batch" data-i18n="btnBatchRun"></button>
        <button class="ghost" id="btn-batch-example" data-i18n="btnBatchExample"></button>
      </div>
      <div id="batch-results"></div>
    </div>
  </section>

  <!-- ============ MODELS ============ -->
  <section id="sec-models" hidden>
    <h2 data-i18n="modelsTitle"></h2>
    <p class="sub" data-i18n="modelsIntro"></p>
    <div id="models-body"></div>
  </section>

  <!-- ============ FBA ============ -->
  <section id="sec-fba" hidden>
    <h2 data-i18n="fbaTitle"></h2>
    <p class="sub" data-i18n="fbaIntro"></p>
    <div class="grid">
      <div class="panel">
        <label for="g-model" data-i18n="fbaModelLabel"></label>
        <select id="g-model"></select>
        <label for="g-preset" data-i18n="fbaPresetLabel"></label>
        <select id="g-preset"></select>
        <label for="g-glc"><span data-i18n="fbaGlucoseLabel"></span> (mmol gDW⁻¹ h⁻¹)</label>
        <input id="g-glc" type="number" step="0.5" min="0" value="15">
        <label for="g-o2"><span data-i18n="fbaOxygenLabel"></span> (mmol gDW⁻¹ h⁻¹)</label>
        <input id="g-o2" type="number" step="0.5" min="0" value="20">
        <label style="display:flex;align-items:center;gap:8px;margin-top:12px">
          <input type="checkbox" id="g-fva" style="width:auto"> <span data-i18n="fvaLabel"></span>
        </label>
        <button class="primary" id="btn-fba" data-i18n="btnFbaRun"></button>
        <button class="ghost" id="btn-fba-attach" data-i18n="btnFbaAttach"></button>
        <p class="note" data-i18n="fbaTabNote"></p>
      </div>
      <div>
        <div id="fba-results"></div>
        <div class="panel" style="margin-top:16px">
          <h2 data-i18n="surrTitle"></h2>
          <p class="sub" data-i18n="surrIntro"></p>
          <label for="surr-model" data-i18n="surrSelect"></label>
          <select id="surr-model"></select>
          <button class="primary" id="btn-surr" data-i18n="surrBtn"></button>
          <div id="surr-results" style="margin-top:12px"></div>
        </div>
      </div>
    </div>
  </section>

  <!-- ============ GOVERNANCE ============ -->
  <section id="sec-governance" hidden>
    <h2 data-i18n="govTitle"></h2>
    <p class="sub" data-i18n="govIntro"></p>
    <div class="actions" id="gov-actions"></div>
    <div id="gov-output" style="margin-top:16px"></div>
  </section>
</main>

  el.textContent = msg; el.hidden = false;
  window.scrollTo({ top: 0, behavior: 'smooth' });

async function api(path, body) {
  const response = await fetch(path, body === undefined
    ? {} : { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
  const payload = await response.json();
  if (!response.ok) throw new Error(payload.error || response.statusText);
  return payload;
}

/* ---------- tabs ---------- */
const SECTIONS = ['predict', 'batch', 'models', 'fba', 'governance'];
function selectTab(id) {
  for (const s of SECTIONS) $('sec-' + s).hidden = s !== id;
  document.querySelectorAll('#tabs button').forEach(b =>
    b.setAttribute('aria-selected', String(b.dataset.id === id)));
}
document.querySelectorAll('#tabs button').forEach(b =>
  b.addEventListener('click', () => selectTab(b.dataset.id)));

/* ---------- language ---------- */
let MODELS = [];            // log10_kcat-capable checkpoints
let ALL_MODELS = [];        // every listing entry, including feature baselines
let lastPredict = null;     // {candidate, tasks, checkpoint}
let lastBatch = null;       // {result}
function applyLang() {
  document.documentElement.lang = LANG === 'zh' ? 'zh-CN' : 'en';
  document.title = t('title');
  document.querySelectorAll('[data-i18n]').forEach(el => { el.textContent = t(el.dataset.i18n); });
  $('lang-btn').textContent = LANG === 'zh' ? 'EN' : '中文';
  renderModelOptions();
  renderGovernance();
  renderModelsTable();
  if (lastPredict) renderPredictResult(lastPredict);
  if (lastBatch) renderBatchResult(lastBatch);
  renderFbaModelSelect();
  renderSurrogateSelect();
  renderFbaBadge();
  if (lastFba) renderFbaResult(lastFba);
  loadHealth();
}
$('lang-btn').addEventListener('click', () => {
  LANG = LANG === 'zh' ? 'en' : 'zh';
  try { localStorage.setItem('workbench-lang', LANG); } catch {}
  applyLang();
});

/* ---------- model selects ---------- */
async function loadModels() {
  try {
    const payload = await api('/api/models');
    ALL_MODELS = payload.models;
    MODELS = ALL_MODELS.filter(m => !m.error && (m.tasks || []).includes('log10_kcat'));
    renderModelOptions();
    renderModelsTable();
  } catch (e) { showError(t('errLoadModels') + e.message); }
}
function renderModelOptions() {
  const options = MODELS.map(m => {
    const v = m.validation && m.validation.log10_kcat;
    const label = `${m.path}` +
      (v && v.rmse != null ? t('valRmse')(v.rmse.toFixed(4)) : '') +
      (m.protein_encoder ? ` [${m.protein_encoder}]` : '');
    return `<option value="${esc(m.path)}">${esc(label)}</option>`;
  }).join('');
  const current = $('f-model').value;
  const currentBatch = $('b-model').value;
  $('f-model').innerHTML = options;
  $('b-model').innerHTML = options;
  const preferred = MODELS.find(m => m.path.includes('esm2-t6-opt-seed7')) || MODELS[0];
  const fallback = preferred ? preferred.path : '';
  $('f-model').value = MODELS.some(m => m.path === current) ? current : fallback;
  $('b-model').value = MODELS.some(m => m.path === currentBatch) ? currentBatch : fallback;
}

/* ---------- health ---------- */
async function loadHealth() {
  try {
    const h = await api('/api/health');
    $('health').textContent = t('healthLine')(h.device, h.loaded_models);
  } catch { $('health').textContent = '—'; }
}

/* ---------- predict ---------- */
function readForm() {
  return {
    candidate_id: 'web-' + new Date().toISOString().slice(11, 19),
    sequence: $('f-seq').value,
    substrate_smiles: $('f-smi').value,
    substrate_name: $('f-name').value,
    organism: $('f-org').value,
    ec: $('f-ec').value,
    enzyme_type: $('f-type').value,
    reaction: $('f-rxn').value,
  };
}
function resultCard(candidateId, tasks) {
  const rows = Object.entries(tasks).map(([task, info]) => {
    if (info.status !== 'trained') {
      return `<tr><td>${esc(task)}</td><td colspan="4"><span class="pill dim">${esc(t('statusUntrained'))}</span></td></tr>`;
    }
    const kcat = info.mean != null ? (10 ** info.mean) : null;
    const kcatStr = kcat != null
      ? (kcat >= 1000 ? kcat.toExponential(3) : kcat.toFixed(3)) : '—';
    const ci = info.conformal_intervals
      ? Object.entries(info.conformal_intervals).map(([n, v]) =>
          `${esc(n)}: [${v.lower == null ? '−∞' : v.lower.toFixed(3)}, ${v.upper == null ? '∞' : v.upper.toFixed(3)}]`).join('<br>')
      : '—';
    const sd = info.calibrated_standard_deviation != null
      ? `${info.standard_deviation.toFixed(3)} → ${info.calibrated_standard_deviation.toFixed(3)}`
      : info.standard_deviation.toFixed(3);
    return `<tr>
      <td><strong>${esc(task)}</strong></td>
      <td class="num">${info.mean.toFixed(4)} ± ${sd}</td>
      <td class="num">${kcatStr}</td>
      <td class="num">${ci}</td>
    </tr>`;
  }).join('');
  return `<div class="panel result-card">
    <div class="cid">${esc(candidateId)}</div>
    <table><thead><tr>
      <th>${t('thTask')}</th><th>${t('thLog10')}</th><th>${t('thKcat')}</th><th>${t('thCi')}</th>
    </tr></thead><tbody>${rows}</tbody></table>
  </div>`;
}
function renderPredictResult(data) {
  $('predict-results').innerHTML =
    resultCard(data.candidate.candidate_id, data.prediction.tasks) +
    `<p class="note">${esc(t('warningNote')(data.checkpoint))}</p>`;
}
async function doPredict(body, onDone) {
  const button = document.activeElement;
  if (button) button.disabled = true;
  try {
    showError(null);
    onDone(await api('/api/predict', body));
  } catch (e) { showError(e.message); }
  finally { if (button) button.disabled = false; }
}
$('btn-predict').addEventListener('click', () => {
  const candidate = readForm();
  const body = { model: $('f-model').value, candidates: [candidate] };
  const cal = $('f-cal').value.trim();
  if (cal) body.calibration_artifact = cal;
  if (attachedFba) body.fba = { features: attachedFba.features, metadata: attachedFba.metadata };
  doPredict(body, (result) => {
    lastPredict = { candidate, prediction: result.predictions[0], checkpoint: result.checkpoint };
    renderPredictResult(lastPredict);
  });
});
$('btn-example').addEventListener('click', () => {
  $('f-seq').value = EXAMPLE.sequence;
  $('f-smi').value = EXAMPLE.substrate_smiles;
  $('f-name').value = EXAMPLE.substrate_name;
  $('f-org').value = EXAMPLE.organism;
  $('f-ec').value = EXAMPLE.ec;
  $('f-type').value = EXAMPLE.enzyme_type;
  $('f-rxn').value = EXAMPLE.reaction;
});

/* ---------- batch ---------- */
$('btn-batch-example').addEventListener('click', () => {
  $('b-json').value = JSON.stringify({ candidates: [
    EXAMPLE,
    { ...EXAMPLE, candidate_id: 'example-2', sequence: 'MKVLWAALLVTFLAGCAQAKV', substrate_smiles: 'CC(=O)OC1=CC=CC=C1' },
  ]}, null, 2);
});
function renderBatchResult(result) {
  const rows = result.predictions.map((p) => {
    const task = Object.entries(p.tasks).find(([, v]) => v.status === 'trained') || Object.entries(p.tasks)[0];
    const [, info] = task;
    const value = info.status === 'trained'
      ? `${info.mean.toFixed(4)} ± ${info.standard_deviation.toFixed(3)}` : t('statusUntrained');
    return `<tr><td>${esc(p.candidate_id)}</td><td>${esc(task[0])}</td><td class="num">${esc(value)}</td></tr>`;
  }).join('');
  $('batch-results').innerHTML = `
    <table><thead><tr>
      <th>${t('thCandidate')}</th><th>${t('thTask')}</th><th>${t('thLog10')}</th>
    </tr></thead><tbody>${rows}</tbody></table>
    <h3>${t('rawResponse')}</h3><pre class="out">${esc(JSON.stringify(result, null, 2))}</pre>`;
}
$('btn-batch').addEventListener('click', () => {
  let parsed;
  try { parsed = JSON.parse($('b-json').value); }
  catch (e) { showError(t('errBatchJson') + e.message); return; }
  const body = { model: $('b-model').value, ...(Array.isArray(parsed) ? { candidates: parsed } : parsed) };
  if (!body.candidates) { showError(t('errNeedCandidates')); return; }
  doPredict(body, (result) => { lastBatch = result; renderBatchResult(result); });
});

/* ---------- models ---------- */
function renderModelsTable() {
  const body = $('models-body');
  if (!ALL_MODELS.length) { body.innerHTML = `<p class="sub">${t('modelsLoading')}</p>`; return; }
  const rows = ALL_MODELS.map(m => {
    if (m.error) {
      return `<tr><td class="mono">${esc(m.path)}</td><td colspan="4"><span class="pill bad">${esc(m.error)}</span></td></tr>`;
    }
    const v = m.validation && m.validation.log10_kcat;
    const metrics = v && v.rmse != null
      ? `RMSE ${v.rmse.toFixed(4)} · MAE ${v.mae.toFixed(4)} · r ${v.pearson.toFixed(4)}` : '—';
    const encoder = m.protein_encoder === 'esm2' ? `ESM-2 (${esc(m.esm2_model_name)})` : esc(m.protein_encoder || '—');
    const size = m.feature_baseline != null
      ? `<td class="num">${(m.size_bytes / 1048576).toFixed(1)} MB</td>`
      : `<td class="num">${(m.size_bytes / 1048576).toFixed(1)} MB</td>`;
    return `<tr class="model-row" data-path="${esc(m.path)}" style="cursor:pointer">
      <td class="mono">${esc(m.path)}</td>
      <td>${encoder}</td>
      ${size}
      <td class="num">${m.epoch ?? '—'}</td>
      <td class="metrics">${metrics}</td>
    </tr>`;
  }).join('');
  body.innerHTML = `<table>
    <thead><tr>
      <th>${t('thCheckpoint')}</th><th>${t('thEncoder')}</th><th>${t('thSize')}</th>
      <th>${t('thEpoch')}</th><th>${t('thValidation')}</th>
    </tr></thead><tbody>${rows}</tbody></table>
    <p class="note">${t('modelsIntro')}</p>`;
  body.querySelectorAll('.model-row').forEach(tr =>
    tr.addEventListener('click', () => {
      $('f-model').value = tr.dataset.path;
      selectTab('predict');
    }));
}

/* ---------- governance ---------- */
function renderGovernance() {
  $('gov-actions').innerHTML = GOV_ACTION_IDS.map(id => {
    const a = t('gov')[id];
    return `
    <div class="action">
      <h4>${esc(a.title)}</h4>
      <p>${esc(a.desc)}</p>
      <button class="gobtn" data-action="${esc(id)}">${t('govRun')}</button>
    </div>`;
  }).join('');
  document.querySelectorAll('#gov-actions .gobtn').forEach(btn =>
    btn.addEventListener('click', async () => {
      btn.disabled = true; btn.textContent = t('govRunning');
      try {
        showError(null);
        const payload = await api('/api/governance', { action: btn.dataset.action });
        const ok = payload.ok;
        const content = ok ? payload.result : payload;
        $('gov-output').innerHTML = `
          <h3>${esc(btn.dataset.action)} <span class="pill ${ok ? 'ok' : 'bad'}">${ok ? t('govOk') : t('govFailed')}</span></h3>
          <pre class="out">${esc(JSON.stringify(content, null, 2))}</pre>`;
      } catch (e) { showError(e.message); }
      finally { btn.disabled = false; btn.textContent = t('govRun'); }
    }));
}

/* ---------- FBA ---------- */
let FBA_STATUS = null;      // /api/fba/status payload
let attachedFba = null;     // {preset, model_id, features, metadata}
function renderFbaBadge() {
  const badge = $('fba-badge');
  if (!attachedFba) { badge.innerHTML = ''; return; }
  badge.innerHTML = `<span class="pill warn">${esc(t('fbaAttached')(attachedFba.preset, attachedFba.model_id))}</span>
    <button class="ghost" id="btn-fba-detach" style="margin:0 0 0 8px;padding:2px 8px">${esc(t('fbaDetach'))}</button>`;
  document.getElementById('btn-fba-detach').addEventListener('click', () => {
    attachedFba = null; renderFbaBadge();
  });
}
async function loadFbaStatus() {
  try {
    FBA_STATUS = await api('/api/fba/status');
    renderFbaModelSelect();
    renderSurrogateSelect();
  } catch (e) { showError(t('errLoadFba') + e.message); }
}
function renderFbaModelSelect() {
  if (!FBA_STATUS) return;
  const ids = Object.keys(FBA_STATUS.models).sort();
  $('g-model').innerHTML = ids.map(id => {
    const m = FBA_STATUS.models[id];
    return `<option value="${esc(id)}" ${m.available ? '' : 'disabled'}>${esc(id)}${m.available ? '' : ' — unavailable'}</option>`;
  }).join('');
  renderFbaPresetSelect();
}
function renderFbaPresetSelect() {
  if (!FBA_STATUS) return;
  const id = $('g-model').value;
  const presets = (FBA_STATUS.models[id] && FBA_STATUS.models[id].presets) || [];
  $('g-preset').innerHTML = presets.map(p => `<option value="${esc(p)}">${esc(p)}</option>`).join('');
}
$('g-model').addEventListener('change', renderFbaPresetSelect);
function renderFbaResult(payload) {
  const fluxRows = Object.entries(payload.fluxes).map(([rid, v]) => {
    const range = payload.fva && payload.fva[rid]
      ? `<td class="num">${payload.fva[rid].minimum.toFixed(3)}</td><td class="num">${payload.fva[rid].maximum.toFixed(3)}</td>`
      : '';
    return `<tr><td class="mono">${esc(rid)}</td><td class="num">${v.toFixed(4)}</td>${range}</tr>`;
  }).join('');
  const fvaHead = payload.fva ? `<th>${t('thFvaMin')}</th><th>${t('thFvaMax')}</th>` : '';
  $('fba-results').innerHTML = `
    <div class="panel result-card">
      <div class="cid">${esc(payload.model_id)} · ${esc(payload.preset)}
        ${payload.fusion_pathways_applied ? '<span class="pill warn">fusion</span>' : ''}</div>
      <p class="sub">${t('thGrowth')}: <strong>${payload.growth.toFixed(4)}</strong>
        · condition <span class="mono">${esc(payload.condition_id.slice(0, 19))}</span></p>
      <table><thead><tr><th>${t('thReaction')}</th><th>${t('thFlux')}</th>${fvaHead}</tr></thead>
      <tbody>${fluxRows}</tbody></table>
      <p class="note">${t('fbaFeatureVector')}: [${payload.features.map(f => f.toFixed(3)).join(', ')}]</p>
      <p class="note">${esc(payload.claim_boundary)}</p>
    </div>`;
}
$('btn-fba').addEventListener('click', () => {
  const body = {
    model_id: $('g-model').value,
    preset: $('g-preset').value,
    glucose: parseFloat($('g-glc').value) || 15,
    oxygen: parseFloat($('g-o2').value) || 20,
    with_fva: $('g-fva').checked,
  };
  const button = $('btn-fba');
  button.disabled = true;
  try {
    showError(null);
    api('/api/fba/run', body).then(payload => {
      lastFba = { ...payload };
      renderFbaResult(payload);
    }).catch(e => showError(e.message));
  } finally { button.disabled = false; }
});
let lastFba = null;
$('btn-fba-attach').addEventListener('click', () => {
  if (!lastFba) { showError(t('errNeedFbaRun')); return; }
  attachedFba = {
    preset: lastFba.preset, model_id: lastFba.model_id,
    features: lastFba.features, metadata: lastFba.metadata,
  };
  renderFbaBadge();
  showError(null);
});

/* ---------- surrogate compare ---------- */
function renderSurrogateSelect() {
  const list = (FBA_STATUS && FBA_STATUS.surrogates) || [];
  $('surr-model').innerHTML = list.map(s0 => {
    const rmse = s0.test_rmse_log10 != null ? ` — RMSE(log10) ${s0.test_rmse_log10.toFixed(4)}` : '';
    return `<option value="${esc(s0.path)}">${esc(s0.gem_model_id)}${esc(rmse)}</option>`;
  }).join('') || '<option value="">—</option>';
}
$('btn-surr').addEventListener('click', async () => {
  try {
    showError(null);
    const payload = await api('/api/fba/surrogate_predict', {
      model_id: $('g-model').value,
      preset: $('g-preset').value,
      glucose: parseFloat($('g-glc').value) || 15,
      oxygen: parseFloat($('g-o2').value) || 20,
    });
    const truth = (lastFba && lastFba.growth != null) ? lastFba.growth : null;
    const err = truth != null ? Math.abs(Math.log10(payload.growth) - Math.log10(truth)) : null;
    $('surr-results').innerHTML = `
      <table><thead><tr><th>${t('surrGrowth')}</th><th>${t('surrTruth')}</th><th>${t('surrAbsErr')}</th></tr></thead>
      <tbody><tr>
        <td class="num"><strong>${payload.growth.toFixed(4)}</strong></td>
        <td class="num">${truth != null ? truth.toFixed(4) : t('surrNoTruth')}</td>
        <td class="num">${err != null ? err.toFixed(4) : '—'}</td>
      </tr></tbody></table>
      <p class="note">${esc(payload.claim_boundary)}</p>`;
  } catch (e) { showError(e.message); }
});

/* ---------- boot ---------- */
applyLang();
loadModels();
loadFbaStatus();
</script>
</body>
</html>
